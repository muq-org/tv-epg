name: Verify EPG Output

on:
    pull_request:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3

            - name: Run unit tests
              run: uv run pytest tests/ -v -m "not integration"

            - name: Generate Swiss provider EPG
              id: swiss
              continue-on-error: true
              run: uv run python src/epg_to_xmltv.py

            - name: Generate Sky Germany EPG
              id: sky
              continue-on-error: true
              run: uv run python src/epg_sky_to_xmltv.py

            - name: Generate DAZN EPG
              id: dazn
              continue-on-error: true
              run: uv run python src/epg_dazn_to_xmltv.py

            - name: Validate EPG outputs
              run: uv run python src/validate_epg.py

            - name: Upload EPG artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: epg-output
                  path: |
                      epg.xml
                      epg_sky.xml
                      epg_dazn.xml

            - name: Report scraper results
              if: always()
              run: |
                  swiss="${{ steps.swiss.outcome }}"
                  sky="${{ steps.sky.outcome }}"
                  dazn="${{ steps.dazn.outcome }}"

                  icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

                  {
                    echo "## EPG Scraper Results"
                    echo ""
                    echo "| Source | Status |"
                    echo "|--------|--------|"
                    echo "| Swiss provider | $(icon $swiss) \`$swiss\` |"
                    echo "| Sky Germany | $(icon $sky) \`$sky\` |"
                    echo "| DAZN | $(icon $dazn) \`$dazn\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$swiss" != "success" ] || [ "$sky" != "success" ] || [ "$dazn" != "success" ]; then
                    echo "::error::One or more EPG scrapers failed — see job summary for details"
                    exit 1
                  fi
