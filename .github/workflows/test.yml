name: Tests

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3

            - name: Run tests
              run: uv run pytest tests/ -v
