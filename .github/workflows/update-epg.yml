name: Update EPG XMLTV

on:
    schedule:
        - cron: '0 5 * * *' # Every day at 05:00 UTC
    workflow_dispatch:

permissions:
    pages: write
    id-token: write

jobs:
    update-epg:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7.6.0

            - name: Generate EPG XMLTV
              id: swiss
              continue-on-error: true
              run: uv run python src/epg_to_xmltv.py

            - name: Generate Sky EPG XMLTV
              id: sky
              continue-on-error: true
              run: uv run python src/epg_sky_to_xmltv.py

            - name: Generate DAZN EPG XMLTV
              id: dazn
              continue-on-error: true
              run: uv run python src/epg_dazn_to_xmltv.py

            - name: Validate EPG outputs
              run: uv run python src/validate_epg.py

            - name: Stage files for Pages
              run: |
                  mkdir _site
                  cp site/index.html _site/
                  for f in epg.xml epg_sky.xml epg_dazn.xml; do
                      [ -f "$f" ] && cp "$f" _site/ || echo "WARNING: $f not found, skipping"
                  done

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Report scraper results
              if: always()
              run: |
                  swiss="${{ steps.swiss.outcome }}"
                  sky="${{ steps.sky.outcome }}"
                  dazn="${{ steps.dazn.outcome }}"

                  icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

                  {
                    echo "## EPG Scraper Results"
                    echo ""
                    echo "| Source | Status |"
                    echo "|--------|--------|"
                    echo "| Swiss provider | $(icon $swiss) \`$swiss\` |"
                    echo "| Sky.de | $(icon $sky) \`$sky\` |"
                    echo "| DAZN | $(icon $dazn) \`$dazn\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$swiss" != "success" ] || [ "$sky" != "success" ] || [ "$dazn" != "success" ]; then
                    echo "::error::One or more EPG scrapers failed — see job summary for details"
                    exit 1
                  fi
