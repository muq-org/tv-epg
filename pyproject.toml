[project]
name = "muq-tv-epg"
version = "0.1.0"
description = "Fetch EPG data from API and convert to XMLTV format."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "lxml",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: calls live external APIs (deselect with -m 'not integration')",
]
